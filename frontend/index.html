<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0814" />
    <title>Neon Reels — PixiJS Slot</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(ellipse at center, #1a0f2e 0%, #07060f 60%, #000 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffd76a;
        font-size: 1.1rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.85;
        pointer-events: none;
      }
      #boot.hidden { display: none; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
